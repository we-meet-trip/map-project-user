<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="1112" viewBox="0 0 1290 1112" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13" fill="#1F2328" role="img" aria-label="로그인 흐름 — 이메일·카카오·Apple"><title>로그인 흐름 — 이메일·카카오·Apple</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606A"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><line x1="185.0" y1="64" x2="185.0" y2="1102" stroke="#8C959F" stroke-dasharray="3 5"/><rect x="84.0" y="12" width="202" height="46" rx="6" fill="#DDF4FF" stroke="#0969DA"/><text x="185.0" y="34" text-anchor="middle" font-weight="700">앱</text><text x="185.0" y="52" text-anchor="middle" font-size="11">map-project-client</text><line x1="415.0" y1="64" x2="415.0" y2="1102" stroke="#8C959F" stroke-dasharray="3 5"/><rect x="314.0" y="12" width="202" height="46" rx="6" fill="#DDF4FF" stroke="#0969DA"/><text x="415.0" y="34" text-anchor="middle" font-weight="700">user</text><text x="415.0" y="52" text-anchor="middle" font-size="11">BFF</text><line x1="645.0" y1="64" x2="645.0" y2="1102" stroke="#8C959F" stroke-dasharray="3 5"/><rect x="544.0" y="12" width="202" height="46" rx="6" fill="#DDF4FF" stroke="#0969DA"/><text x="645.0" y="34" text-anchor="middle" font-weight="700">Kakao API</text><text x="645.0" y="52" text-anchor="middle" font-size="11">외부</text><line x1="875.0" y1="64" x2="875.0" y2="1102" stroke="#8C959F" stroke-dasharray="3 5"/><rect x="774.0" y="12" width="202" height="46" rx="6" fill="#DDF4FF" stroke="#0969DA"/><text x="875.0" y="34" text-anchor="middle" font-weight="700">Apple ID</text><text x="875.0" y="52" text-anchor="middle" font-size="11">외부</text><line x1="1105.0" y1="64" x2="1105.0" y2="1102" stroke="#8C959F" stroke-dasharray="3 5"/><rect x="1004.0" y="12" width="202" height="46" rx="6" fill="#DDF4FF" stroke="#0969DA"/><text x="1105.0" y="34" text-anchor="middle" font-weight="700">저장소</text><text x="1105.0" y="52" text-anchor="middle" font-size="11">PostgreSQL·Redis</text><rect x="35.0" y="104" width="1220" height="26" rx="4" fill="#F6F8FA" stroke="#D0D7DE"/><text x="45.0" y="122" font-weight="600">이메일</text><text x="300.0" y="156" text-anchor="middle">POST /auth/signup ·</text><text x="300.0" y="174" text-anchor="middle">/auth/login</text><line x1="185.0" y1="180" x2="415.0" y2="180" stroke="#57606A" marker-end="url(#arr)"/><text x="760.0" y="214" text-anchor="middle">BCrypt 확인, refresh 해시 저장</text><line x1="415.0" y1="220" x2="1105.0" y2="220" stroke="#57606A" marker-end="url(#arr)"/><text x="300.0" y="254" text-anchor="middle">access(1시간) +</text><text x="300.0" y="272" text-anchor="middle">refresh(30일)</text><line x1="415.0" y1="278" x2="185.0" y2="278" stroke="#57606A" stroke-dasharray="6 4" marker-end="url(#arr)"/><rect x="35.0" y="300" width="1220" height="26" rx="4" fill="#F6F8FA" stroke="#D0D7DE"/><text x="45.0" y="318" font-weight="600">카카오 — 앱 SDK 가 받은 액세스 토큰</text><text x="300.0" y="352" text-anchor="middle">POST /auth/kakao/callback</text><text x="300.0" y="370" text-anchor="middle">(액세스 토큰)</text><line x1="185.0" y1="376" x2="415.0" y2="376" stroke="#57606A" marker-end="url(#arr)"/><text x="530.0" y="410" text-anchor="middle">토큰 정보: 앱 번호가 설정값과</text><text x="530.0" y="428" text-anchor="middle">같은가</text><line x1="415.0" y1="434" x2="645.0" y2="434" stroke="#57606A" marker-end="url(#arr)"/><text x="530.0" y="468" text-anchor="middle">사용자 정보</text><line x1="415.0" y1="474" x2="645.0" y2="474" stroke="#57606A" marker-end="url(#arr)"/><text x="760.0" y="508" text-anchor="middle">연결된 계정 찾기·만들기(토큰은 저장 안 함)</text><line x1="415.0" y1="514" x2="1105.0" y2="514" stroke="#57606A" marker-end="url(#arr)"/><text x="300.0" y="548" text-anchor="middle">access + refresh</text><line x1="415.0" y1="554" x2="185.0" y2="554" stroke="#57606A" stroke-dasharray="6 4" marker-end="url(#arr)"/><rect x="35.0" y="576" width="1220" height="26" rx="4" fill="#F6F8FA" stroke="#D0D7DE"/><text x="45.0" y="594" font-weight="600">Apple</text><text x="300.0" y="628" text-anchor="middle">GET /auth/apple/nonce</text><line x1="185.0" y1="634" x2="415.0" y2="634" stroke="#57606A" marker-end="url(#arr)"/><text x="300.0" y="668" text-anchor="middle">POST /auth/apple/callback</text><text x="300.0" y="686" text-anchor="middle">(identity token, 인가 코드)</text><line x1="185.0" y1="692" x2="415.0" y2="692" stroke="#57606A" marker-end="url(#arr)"/><path d="M415.0,714 h28 v22 h-28" fill="none" stroke="#57606A" marker-end="url(#arr)"/><text x="451.0" y="728">발급자·대상·nonce·만료 검증</text><text x="645.0" y="770" text-anchor="middle">인가 코드 교환</text><line x1="415.0" y1="776" x2="875.0" y2="776" stroke="#57606A" marker-end="url(#arr)"/><text x="760.0" y="810" text-anchor="middle">Apple refresh 토큰을 암호화해 저장</text><line x1="415.0" y1="816" x2="1105.0" y2="816" stroke="#57606A" marker-end="url(#arr)"/><text x="300.0" y="850" text-anchor="middle">access + refresh</text><line x1="415.0" y1="856" x2="185.0" y2="856" stroke="#57606A" stroke-dasharray="6 4" marker-end="url(#arr)"/><rect x="35.0" y="878" width="1220" height="26" rx="4" fill="#F6F8FA" stroke="#D0D7DE"/><text x="45.0" y="896" font-weight="600">갱신·로그아웃</text><text x="300.0" y="930" text-anchor="middle">POST /auth/token/refresh</text><line x1="185.0" y1="936" x2="415.0" y2="936" stroke="#57606A" marker-end="url(#arr)"/><path d="M415.0,958 h28 v22 h-28" fill="none" stroke="#57606A" marker-end="url(#arr)"/><text x="451.0" y="972">세션 계열 안에서 회전, 재사용되면 계열 폐기</text><text x="300.0" y="1014" text-anchor="middle">POST /auth/logout</text><line x1="185.0" y1="1020" x2="415.0" y2="1020" stroke="#57606A" marker-end="url(#arr)"/><text x="760.0" y="1054" text-anchor="middle">access 를 Redis 폐기 목록에</text><line x1="415.0" y1="1060" x2="1105.0" y2="1060" stroke="#57606A" marker-end="url(#arr)"/></svg>
